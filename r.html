<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQR Hub & Redirector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Smart Resolver Card -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl space-y-4">
        
        <div class="flex items-center justify-center gap-2 mb-1">
            <div class="grid grid-cols-2 gap-0.5 w-5 h-5">
                <span class="bg-blue-500 rounded-2xs"></span><span class="bg-white rounded-2xs"></span>
                <span class="bg-white rounded-2xs"></span><span class="bg-emerald-500 rounded-2xs"></span>
            </div>
            <span class="font-extrabold text-xs tracking-tight text-slate-200">SMART QR PRO</span>
        </div>

        <div id="spinnerBox" class="flex justify-center py-4">
            <div class="animate-spin w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full"></div>
        </div>

        <h1 id="statusTitle" class="text-lg font-extrabold text-white">Opening QR Content...</h1>
        <p id="statusSub" class="text-xs text-slate-400">Fast & secure dynamic QR resolution</p>

        <!-- Dynamic Interactive Card (For VCard, UPI, Wi-Fi, Social Hub, Visiting Card, Text) -->
        <div id="dynamicContainer" class="hidden text-left space-y-3 pt-2"></div>

        <div id="actionBox" class="hidden pt-3 border-t border-slate-800">
            <a href="./index.html" class="inline-block w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2.5 px-4 rounded-xl transition text-center">
                ⚡ Create Your Own Dynamic QR Code
            </a>
        </div>
    </div>

    <script type="module">
        import { db, doc, getDoc, updateDoc, increment, serverTimestamp } from "./firebase-config.js";

        function detectDevice() {
            const ua = navigator.userAgent || "";
            if (/android/i.test(ua)) return "Android";
            if (/iphone|ipad|ipod/i.test(ua)) return "iPhone";
            return "Desktop";
        }

        function detectTimeSlot() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return "Morning";
            if (hour >= 12 && hour < 17) return "Afternoon";
            if (hour >= 17 && hour < 21) return "Evening";
            return "Night";
        }

        function showCardView(title, subtitle, innerHtml) {
            document.getElementById("spinnerBox").classList.add("hidden");
            document.getElementById("statusTitle").textContent = title;
            document.getElementById("statusSub").textContent = subtitle;
            const cont = document.getElementById("dynamicContainer");
            cont.innerHTML = innerHtml;
            cont.classList.remove("hidden");
            document.getElementById("actionBox").classList.remove("hidden");
        }

        // Helper to Download .vcf File so Mobile Phonebook Opens Immediately
        window.downloadVcfFile = function(vcfString, fileName) {
            const blob = new Blob([vcfString], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${(fileName || "Contact").replace(/[^a-zA-Z0-9]/g, "_")}.vcf`;
            a.click();
        };

        window.copyTextHelper = function(txt, label) {
            navigator.clipboard.writeText(txt);
            alert(`✅ ${label} Copied: ${txt}`);
        };

        function renderSocialHubUI(hubData) {
            let linksHtml = "";
            if (hubData.ig) linksHtml += `<a href="${hubData.ig}" target="_blank" class="block w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs py-3.5 px-4 rounded-xl text-center shadow">📸 Follow on Instagram</a>`;
            if (hubData.yt) linksHtml += `<a href="${hubData.yt}" target="_blank" class="block w-full bg-red-600 hover:bg-red-700 text-white font-bold text-xs py-3.5 px-4 rounded-xl text-center shadow">▶️ Subscribe on YouTube</a>`;
            if (hubData.wa) linksHtml += `<a href="https://wa.me/${hubData.wa.replace(/\D/g, '')}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3.5 px-4 rounded-xl text-center shadow">💬 Chat on WhatsApp</a>`;
            if (hubData.wb) linksHtml += `<a href="${hubData.wb}" target="_blank" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3.5 px-4 rounded-xl text-center shadow">🌐 Visit Official Website</a>`;
            showCardView(hubData.t || "Social Media Hub", "Connect with us on our official channels:", linksHtml || "<p class='text-xs text-center text-slate-400'>No links configured.</p>");
        }

        async function resolveQrScan() {
            const params = new URLSearchParams(window.location.search);
            const shortId = params.get("id");
            const hubEncoded = params.get("hub");
            const cardEncoded = params.get("card");

            // 1. Direct Social Hub QR
            if (hubEncoded) {
                try {
                    const hubData = JSON.parse(decodeURIComponent(atob(hubEncoded)));
                    renderSocialHubUI(hubData);
                    return;
                } catch (e) {
                    showCardView("⚠️ Invalid Hub Link", "Could not decode Social Hub.", "");
                    return;
                }
            }

            // 2. Shopkeeper Digital Visiting Card QR
            if (cardEncoded) {
                try {
                    const card = JSON.parse(decodeURIComponent(atob(cardEncoded)));
                    const cleanPhone = (card.p || "").replace(/\D/g, "");
                    const waMsg = encodeURIComponent(`Hello ${card.n}, I scanned your QR Code and want to inquire about your products.`);
                    showCardView(
                        card.n || "Digital Business Card",
                        card.a || "Verified Local Business",
                        `
                        <div class="bg-slate-800 p-4 rounded-2xl space-y-2 border border-slate-700 text-xs">
                            <p><strong class="text-slate-400">📍 Address:</strong> ${card.a || "Available on request"}</p>
                            <p><strong class="text-slate-400">📦 Products / Services:</strong> ${card.items || "All general items"}</p>
                        </div>
                        <a href="https://wa.me/${cleanPhone}?text=${waMsg}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-3.5 rounded-xl text-center shadow">
                            💬 Order / Chat on WhatsApp (${card.p})
                        </a>
                        <a href="tel:${cleanPhone}" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs py-3 rounded-xl text-center">
                            📞 Call Now
                        </a>
                        `
                    );
                    return;
                } catch (e) {
                    showCardView("⚠️ Invalid Visiting Card", "Could not load shop details.", "");
                    return;
                }
            }

            // 3. Dynamic QR Code (Firestore Lookup)
            if (!shortId) {
                showCardView("⚠️ Invalid QR Link", "No QR ID found in URL.", "");
                return;
            }

            try {
                const qrRef = doc(db, "qrcodes", shortId);
                const qrSnap = await getDoc(qrRef);

                if (!qrSnap.exists()) {
                    showCardView("❌ QR Code Deleted", "Yeh Dynamic QR code owner dwara delete kiya ja chuka hai.", "");
                    return;
                }

                const data = qrSnap.data();

                if (!data.active) {
                    showCardView("⏸️ QR Code Paused", "Is QR Code ke owner ne filhal is link ko pause kar rakha hai.", "");
                    return;
                }

                // Increment Real-Time Scan Analytics
                const device = detectDevice();
                const timeSlot = detectTimeSlot();
                try {
                    await updateDoc(qrRef, {
                        scans: increment(1),
                        lastScannedAt: serverTimestamp(),
                        [`analytics.devices.${device}`]: increment(1),
                        [`analytics.timeOfDay.${timeSlot}`]: increment(1)
                    });
                } catch (e) {
                    console.warn("Analytics skip:", e);
                }

                const qrType = data.qrType || "url";
                const s = data.structuredData || {};
                const target = (data.targetUrl || "").trim();

                // HANDLE DYNAMIC TYPE 1: VCARD DIGITAL CONTACT CARD
                if (qrType === "vcard" || target.startsWith("BEGIN:VCARD")) {
                    const name = s.vcName || data.title || "Business Contact";
                    const phone = s.vcPhone || "";
                    const email = s.vcEmail || "";
                    const org = s.vcOrg || "";
                    const web = s.vcWeb || "";
                    const addr = s.vcAddr || "";

                    window.currentVcfPayload = target;

                    showCardView(
                        `🪪 ${name}`,
                        org || "Digital Contact Card",
                        `
                        <div class="bg-slate-800 p-4 rounded-2xl space-y-2 border border-slate-700 text-xs">
                            ${phone ? `<p><strong>📞 Mobile:</strong> <a href="tel:${phone}" class="text-blue-400 underline">${phone}</a></p>` : ""}
                            ${email ? `<p><strong>✉️ Email:</strong> <a href="mailto:${email}" class="text-blue-400 underline">${email}</a></p>` : ""}
                            ${org ? `<p><strong>🏢 Company:</strong> ${org}</p>` : ""}
                            ${addr ? `<p><strong>📍 Address:</strong> ${addr}</p>` : ""}
                            ${web ? `<p><strong>🌐 Website:</strong> <a href="${web}" target="_blank" class="text-blue-400 underline">${web}</a></p>` : ""}
                        </div>
                        <button onclick="downloadVcfFile(window.currentVcfPayload, '${name.replace(/'/g, "")}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs py-3.5 rounded-xl shadow flex items-center justify-center gap-2">
                            <span>📥</span><span>Save Contact to Phonebook</span>
                        </button>
                        ${phone ? `<a href="tel:${phone}" class="block w-full bg-emerald-600 text-white font-extrabold text-xs py-3 rounded-xl text-center">📞 Call ${name}</a>` : ""}
                        `
                    );
                    return;
                }

                // HANDLE DYNAMIC TYPE 2: UPI PAYMENT
                if (qrType === "upi" || /^upi:\/\/pay/i.test(target)) {
                    const upiId = s.upiId || (new URLSearchParams(target.split("?")[1] || "").get("pa")) || "";
                    const payee = s.upiName || data.title || "Merchant";
                    const amt = s.upiAmount || (new URLSearchParams(target.split("?")[1] || "").get("am")) || "";

                    // Attempt automatic UPI App trigger on mobile
                    setTimeout(() => { window.location.href = target; }, 300);

                    showCardView(
                        `₹ Pay to ${payee}`,
                        "Verified UPI Payment QR",
                        `
                        <div class="bg-emerald-950/60 border border-emerald-700/50 rounded-2xl p-4 text-center space-y-1">
                            <p class="text-[11px] text-emerald-300">UPI ID</p>
                            <p class="text-sm font-mono font-extrabold text-white">${upiId}</p>
                            ${amt ? `<p class="text-2xl font-black text-emerald-400 pt-1">₹${amt}</p>` : `<p class="text-xs text-slate-400">Enter amount in your UPI app</p>`}
                        </div>
                        <a href="${target}" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-3.5 rounded-xl text-center shadow-lg">
                            📱 Open GPay / PhonePe / Paytm
                        </a>
                        <button onclick="copyTextHelper('${upiId}', 'UPI ID')" class="w-full bg-slate-800 text-slate-200 font-bold text-xs py-3 rounded-xl">
                            📋 Copy UPI ID
                        </button>
                        `
                    );
                    return;
                }

                // HANDLE DYNAMIC TYPE 3: WI-FI AUTO CONNECT
                if (qrType === "wifi" || target.startsWith("WIFI:")) {
                    const ssid = s.wifiSsid || "Wi-Fi Network";
                    const pass = s.wifiPass || "";
                    const enc = s.wifiEnc || "WPA";

                    showCardView(
                        `📶 Wi-Fi: ${ssid}`,
                        `Security: ${enc}`,
                        `
                        <div class="bg-slate-800 p-4 rounded-2xl space-y-2 border border-slate-700 text-xs">
                            <p><strong>Network Name (SSID):</strong> <span class="text-blue-400 font-mono">${ssid}</span></p>
                            <p><strong>Password:</strong> <span class="text-emerald-400 font-mono">${pass || "No Password"}</span></p>
                        </div>
                        ${pass ? `
                            <button onclick="copyTextHelper('${pass.replace(/'/g, "")}', 'Wi-Fi Password')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs py-3.5 rounded-xl shadow">
                                📋 Copy Wi-Fi Password
                            </button>
                        ` : ""}
                        `
                    );
                    return;
                }

                // HANDLE DYNAMIC TYPE 4: PLAIN TEXT / NOTICE
                if (qrType === "text") {
                    showCardView(
                        data.title || "📝 QR Message",
                        "Plain Text Content",
                        `
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-xs leading-relaxed whitespace-pre-wrap break-words">${target}</div>
                        <button onclick="copyTextHelper(\`${target.replace(/`/g, "")}\`, 'Text')" class="w-full bg-blue-600 text-white font-extrabold text-xs py-3 rounded-xl">
                            📋 Copy Text
                        </button>
                        `
                    );
                    return;
                }

                // HANDLE DYNAMIC TYPE 5: SOCIAL HUB OR DIRECT REDIRECT (URL / WHATSAPP / PHONE)
                if (target.includes("r.html?hub=")) {
                    window.location.replace(target);
                    return;
                }

                let finalUrl = target;
                if (!/^(https?:\/\/|tel:|mailto:|upi:\/\/)/i.test(finalUrl)) {
                    finalUrl = "https://" + finalUrl;
                }
                window.location.replace(finalUrl);

            } catch (err) {
                showCardView("⚠️ Connection Error", err.message, "");
            }
        }

        resolveQrScan();
    </script>
</body>
</html>
